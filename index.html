body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}
button{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--ac)}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--go);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--ln);padding:calc(8px + env(safe-area-inset-top)) 10px 8px}
.bar{display:flex;gap:8px;align-items:center}
.ib{padding:0;border:2px solid var(--ac);border-radius:12px;overflow:hidden;width:44px;height:44px;flex:none;background:#fff}.ib img{display:block;width:100%;height:100%}
#q{flex:1;min-width:0;background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:10px 12px}
.go{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.row{display:flex;gap:6px;overflow-x:auto;margin-top:8px;scrollbar-width:none}.row>*{flex:none}
.chip{font-size:12.5px;padding:4px 9px;border-radius:99px;border:1px solid var(--ln);background:var(--pn);color:var(--mu)}
.chip.ok{color:var(--ok)}.chip.rate{color:var(--wr)}.chip.captcha{color:var(--wr)}.chip.er{color:var(--er)}
.chip button{padding:0 6px;margin-left:4px;border-radius:99px;font-size:12px;background:var(--ac);border-color:var(--ac);color:#fff}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:10px}
@media(min-width:700px){.gr{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}
.c{position:relative;background:var(--pn);border-radius:12px;aspect-ratio:3/4}
.c a,.c img{display:block;width:100%;height:100%}.c img{object-fit:cover;background:var(--pn);border-radius:12px}
.hide,.rv{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;color:var(--mu);font-size:12.5px;text-align:center;background:repeating-linear-gradient(45deg,#172a30,#172a30 10px,#1b3037 10px,#1b3037 20px)}.hide{width:100%;height:100%;border-radius:12px}.rv{padding:56px 0;border-radius:14px;cursor:pointer}.hide svg.i,.rv svg.i{width:26px;height:26px}.sub{margin:14px 0 0;color:var(--mu);font-size:13px}
.b{position:absolute;left:6px;top:6px;background:#000b;border-radius:6px;padding:1px 7px;font-size:11.5px}
.n{position:absolute;right:6px;top:6px;background:var(--go);color:#222;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700}
.r{position:absolute;left:8px;bottom:8px;width:9px;height:9px;border-radius:50%;background:var(--ok)}.r1{background:var(--wr)}.r2{background:var(--er)}
.a{position:absolute;inset:auto 0 0;display:flex;gap:6px;padding:6px;background:linear-gradient(#0000,#000c)}
.a button{flex:1;padding:5px;background:#0009}.a .f{color:var(--ac)}
#s{height:60px;display:flex;justify-content:center;align-items:center;color:var(--mu)}
.bun{image-rendering:pixelated;width:60px}.sm{width:36px}
#sp{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;transition:opacity .4s}
#sp b{font-size:22px;color:var(--go);letter-spacing:.5px}#sp .bun{width:120px}
dialog{background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:16px;width:min(560px,94vw);max-height:88vh}
dialog::backdrop{background:#000a}
.s1{display:flex;gap:6px;align-items:center;margin:8px 0;flex-wrap:wrap}
.s1 input[type=text],.s1 input:not([type]),.s1 select{background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:6px 8px;min-width:0}
.s1 .w{flex:1}
dialog{padding:16px 18px}.dh{display:flex;justify-content:space-between;align-items:center}.dh h3{margin:0;font-size:20px}
.sec{margin:20px 0 4px;font-weight:600;color:var(--go);font-size:15px}
.sr,.pr{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--ln)}.pr{justify-content:space-between}
.sw{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:99px;background:var(--ln);position:relative;flex:none;cursor:pointer;margin:0;border:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}.sw:checked{background:var(--ac)}.sw:checked::after{left:21px}
.nm{flex:1;min-width:0}.nm small{display:block;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kr{display:none;gap:6px;padding:0 0 10px}.kr.o{display:flex}.kr input{flex:1;min-width:0}
dialog input:not([type=checkbox]),dialog select{background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;min-width:0}
.add{display:grid;gap:8px}
#t{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000e;border:1px solid var(--ln);padding:8px 14px;border-radius:12px;z-index:30;display:none;max-width:90vw}
.gr[hidden]{display:none}#h:empty{display:none}body{padding-bottom:calc(30px + env(safe-area-inset-bottom))}
#nv{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:space-around;gap:6px;padding:8px 14px calc(8px + env(safe-area-inset-bottom));background:var(--pn);border-top:1px solid var(--ln);border-radius:22px 22px 0 0;box-shadow:0 -6px 24px #0008}
#nv button{flex:1;max-width:140px;border:0;background:none;border-radius:16px;padding:5px 4px;color:var(--mu);display:flex;flex-direction:column;align-items:center;font-size:12.5px;position:relative}
#nv button b{font-size:20px;line-height:1.3;font-weight:400}#nv button.on{background:#c4569f2b;color:var(--go)}
#nv i{font-style:normal;position:absolute;top:0;right:20%;min-width:16px;border-radius:99px;background:var(--ac);color:#fff;font-size:10.5px;line-height:16px;text-align:center}#nv i:empty{display:none}
#fab{position:fixed;left:0;top:0;z-index:18;width:54px;height:54px;border-radius:50%;background:var(--ac);border:0;padding:0;box-shadow:0 6px 18px #c4569f66;touch-action:none;display:flex;align-items:center;justify-content:center}
#fab{transition:left .28s ease,opacity .2s}#fab.drag{transition:none}#fab.dk{opacity:.85}#fab svg{width:30px;height:30px;fill:#fff}#fab .ct{fill:var(--ac)}
:root{--ic:#e58ac4}svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:var(--ic);flex:none}.on svg.i{fill:currentColor}
.c{cursor:pointer}.sv{position:absolute;right:7px;bottom:6px}.sv svg{fill:currentColor;width:18px;height:18px}
#sc{position:fixed;inset:0;background:#000b;z-index:14}#sc[hidden],#sh[hidden]{display:none}
#sh{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(600px,100%);max-height:88vh;overflow:auto;background:var(--pn);border:1px solid var(--ln);border-radius:22px 22px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom));z-index:15}
.xb{position:absolute;right:12px;top:10px;z-index:2;border-radius:99px;padding:4px 10px;background:#000a}
.pv img,.pv video{display:block;width:100%;max-height:50vh;object-fit:contain;background:var(--bg);border-radius:14px}
#sh h3{margin:12px 0 4px;font-size:18px}#sh h3 span{color:var(--mu);font-weight:400}
.meta{display:flex;gap:6px;flex-wrap:wrap}.meta span{font-size:12.5px;padding:2px 9px;border-radius:99px;background:var(--bg);color:var(--mu)}
.tg{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.tg button{padding:3px 9px;border-radius:99px;font-size:12.5px;color:var(--mu)}
.act{display:flex;gap:8px;margin:12px 0}.act button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:11px}.act .go svg.i{color:#fff}.act .on{color:var(--go)}
.lk{display:flex;gap:18px;align-items:center;font-size:14px}.lk a{color:var(--go)}.lk button{border:0;background:none;color:var(--mu);padding:0;text-decoration:underline}
.hl button{display:flex;align-items:center;gap:10px;width:100%;border:0;border-top:1px solid var(--ln);border-radius:0;background:none;padding:12px 4px;text-align:left}
#mn{position:fixed;z-index:19;display:flex;flex-direction:column;gap:2px;padding:6px;background:var(--pn);border:1px solid var(--ln);border-radius:18px;box-shadow:0 10px 30px #000a;min-width:190px}#mn[hidden]{display:none}
#mn button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px 12px;border-radius:12px;text-align:left}#mn button.cur{background:#c4569f2b;color:var(--go)}#mn button span{margin-left:auto;color:var(--mu);font-size:12.5px}
#fab:active{transform:scale(.92)}
.info{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--mu);font-size:13.5px}
.a .pop{animation:pop .3s}@keyframes pop{50%{transform:scale(1.4)}}.em img.bun{margin-bottom:10px}
.em{text-align:center;color:var(--mu);padding:40px 20px;grid-column:1/-1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

function armDock(){clearTimeout(tm);tm=setTimeout(()=>{if(dr||!mn.hidden)return armDock();S.fab.s=S.fab.x+FZ/2<innerWidth/2?'l':'r';docked=true;place();save()},2500)}
function clampFab(){const top=hb();S.fab.x=Math.min(Math.max(6,S.fab.x),innerWidth-FZ-6);S.fab.y=Math.min(Math.max(top,S.fab.y),Math.max(top,innerHeight-FZ-8));place()}
function closeMenu(){mn.hidden=true;armDock();sync()}
function fabVis(){sync()}
function openMenu(){clampFab();const it=[['feed','Feed',IC.feed,''],['fav','Saved',IC.heart,Object.keys(S.favs).length||''],['dl','Hoard',IC.dl,Object.keys(S.dls).length||''],['hist','History',IC.clock,S.hist.length||''],['fetch','Fetch now',IC.sync,'']];
 mn.innerHTML=it.map(([k,n,ic,c])=>`<button data-m="${k}" class="${k==view&&sh.hidden?'cur':''}">${ic}${n}${c?`<span>${c}</span>`:''}</button>`).join('');mn.hidden=false;
 const mh=mn.offsetHeight,mw=mn.offsetWidth,top=hb()-2;let up=S.fab.y+FZ/2>innerHeight/2;if(up&&S.fab.y-mh-8<top)up=false;if(!up&&S.fab.y+FZ+mh+8>innerHeight)up=true;
 mn.style.top=Math.max(top,up?S.fab.y-mh-8:S.fab.y+FZ+8)+'px';const right=S.fab.x+FZ/2>innerWidth/2;mn.style.left=Math.min(Math.max(6,right?S.fab.x+FZ-mw:S.fab.x),innerWidth-mw-6)+'px'}
fab.onpointerdown=e=>{if(docked){S.fab.x=S.fab.s=='l'?6:innerWidth-FZ-6;docked=false}fab.classList.add('drag');place();clearTimeout(tm);dr={sx:e.clientX,sy:e.clientY,x:S.fab.x,y:S.fab.y,m:0};dragged=false;fab.setPointerCapture(e.pointerId)};
fab.onpointermove=e=>{if(!dr)return;const dx=e.clientX-dr.sx,dy=e.clientY-dr.sy;if(Math.abs(dx)+Math.abs(dy)>8)dr.m=1;if(dr.m){S.fab.x=dr.x+dx;S.fab.y=dr.y+dy;clampFab();closeMenu()}};
fab.onpointerup=fab.onpointercancel=()=>{fab.classList.remove('drag');armDock();if(dr&&dr.m){dragged=true;save()}dr=null};
fab.onclick=()=>{if(dragged){dragged=false;return}mn.hidden?(openMenu(),sync()):closeMenu()};
document.addEventListener('pointerdown',e=>{if(!mn.hidden&&!e.target.closest('#mn,#fab'))closeMenu()});
document.addEventListener('keydown',e=>{if(e.key=='Escape'){closeMenu();closeSh()}});
mn.onclick=e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.m;closeMenu();closeSh();
 if(a=='hist')openHist();else if(a=='fetch'){show('feed');S.sources.forEach(s=>s.cool=0);load('refresh');toast('Fetching every source now. Waits between requests still apply.')}
 else if(a=='feed'&&view=='feed')scrollTo({top:0,behavior:'smooth'});else show(a)};
/* ---- Android back button: close the top layer instead of leaving the app ---- */
let pushed=false,skip=false;
const anyLayer=()=>$('#d').open||!mn.hidden||!sh.hidden||view!='feed';
function sync(){if(skip)return;const a=anyLayer();
 if(a&&!pushed){history.pushState({u:1},'');pushed=true}
 else if(!a&&pushed){pushed=false;skip=true;history.back()}}
function backOne(){const d=$('#d');if(d.open)d.close();else if(!mn.hidden)closeMenu();else if(!sh.hidden)closeSh();else if(view!='feed')show('feed')}
addEventListener('popstate',()=>{if(skip){skip=false;sync();return}pushed=false;backOne();sync()});
S.fab=S.fab||{x:innerWidth-72,y:innerHeight-150};S.fab.s=S.fab.s||'r';clampFab();fabVis();addEventListener('scroll',fabVis,{passive:true});addEventListener('resize',()=>{clampFab();fabVis()});
$('#ch').onclick=e=>{const b=e.target.closest('button'),s=b&&S.sources.find(x=>x.id==(b.dataset.s||b.dataset.r));if(!s)return;
 if(b.dataset.s)solve(s);else{s.cool=0;load('refresh')}};
$('#go').onclick=search;$('#q').onkeydown=e=>e.key=='Enter'&&search();
/* ---- settings ---- */
const CATS=[['safe','Safe only'],['mix','Mixed: safe and mature'],['adult','Mature (18+): used only when Ratings is Everything']];
function setUI(){$('#sl').innerHTML=CATS.map(([c,n])=>{const l=S.sources.map((s,i)=>[s,i]).filter(([s])=>(s.cat||'mix')==c);return l.length?`<p class="sub">${n}</p>`+l.map(([s,i])=>`<div class="sr"><input type="checkbox" class="sw" data-i="${i}" data-f="on" ${s.on?'checked':''} aria-label="${esc(s.name)}"><div class="nm"><b>${esc(s.name)}</b><small>${esc(s.url)}</small></div><button data-key="${i}">${s.key?'Key ✓':'Key'}</button></div>
 <div class="kr" id="kr${i}"><input placeholder="User ID" value="${esc(s.user)}" data-i="${i}" data-f="user"><input placeholder="API key" value="${esc(s.key)}" data-i="${i}" data-f="key">${s.b?'':`<button data-x="${i}">Remove</button>`}</div>`).join(''):''}).join('');
 $('#pr').value=S.rating;$('#pb').checked=S.blur;$('#pa').value=S.auto}
$('#st').onclick=()=>{setUI();$('#d').showModal();sync()};$('#d').addEventListener('close',()=>sync());
$('#sl').onchange=e=>{const t=e.target,s=S.sources[t.dataset.i];if(s){s[t.dataset.f]=t.type=='checkbox'?t.checked:t.value.trim();save()}};
$('#sl').onclick=e=>{const d=e.target.dataset,i=d.x;if(d.key!=null)$('#kr'+d.key).classList.toggle('o');if(i!=null){S.sources.splice(i,1);save();setUI()}};
$('#aa').onclick=()=>{let n=$('#an').value.trim(),u=$('#au').value.trim();if(!n||!/^https?:\/\//.test(u))return toast('Enter a name and a link starting with https://');
 S.sources.push({id:'c'+Date.now(),name:n,url:u,engine:$('#ae').value,cat:$('#ac').value,on:true,key:'',user:''});save();$('#an').value=$('#au').value='';setUI()};
$('#pr').onchange=e=>{const v=+e.target.value;if(v&&!confirm('This can show adult content. Are you 18 or older?')){e.target.value=S.rating;return}S.rating=v;save()};
$('#pb').onchange=e=>{S.blur=e.target.checked;document.body.classList.toggle('blur',S.blur);save()};
$('#pa').onchange=e=>{S.auto=+e.target.value;save();auto()};
$('#dc').onclick=()=>{$('#d').close();search()};
/* ---- back button: close things one step at a time ---- */
function goBack(){if(!mn.hidden){closeMenu();return 1}if($('#d').open){$('#dc').click();return 1}if(!sh.hidden){closeSh();return 1}if(view!='feed'){show('feed');return 1}return 0}
history.replaceState({r:1},'');history.pushState({a:1},'');
let armed=true,rt;const arm=()=>{if(!armed){history.pushState({a:1},'');armed=true}};
addEventListener('popstate',()=>{armed=false;clearTimeout(rt);if(goBack()){arm();return}toast('Press back again to exit',2000);rt=setTimeout(arm,2200)});
document.body.classList.toggle('blur',S.blur);auto();
Promise.all([load('new'),sleep(1400)]).then(()=>{const sp=$('#sp');sp.style.opacity=0;setTimeout(()=>sp.remove(),400)});
</script></body></html>

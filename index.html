 if(x.directory&&x.image){pv=pv||`${b}/thumbnails/${x.directory}/thumbnail_${x.hash}.jpg`;fu=fu||`${b}/images/${x.directory}/${x.image}`}
 if(!pv&&!fu)return null;const r=String(x.rating||'?')[0];
 return{k:s.id+':'+x.id,id:+x.id,src:s.name,tg:String(x.tags||x.tag_string||'').slice(0,400),w:x.width||x.image_width||0,h:x.height||x.image_height||0,sm:fix(x.sample_url||x.large_file_url)||fu||pv,pv:pv||fu,fu:fu||pv,lv:r=='e'?2:r=='q'?1:0,
  link:e=='dan'?`${b}/posts/${x.id}`:e=='moe'?`${b}/post/show/${x.id}`:`${b.replace('api.','')}/index.php?page=post&s=view&id=${x.id}`}}
async function fetchSrc(s,q,p){
 const es=s.engine=='auto'?['dan','moe','dapi']:[s.engine];let last;
 for(const e of es){try{const qq=S.rating==0&&s.sf&&(e!='dan'||q.trim().split(/\s+/).filter(Boolean).length<2)?(q+' '+s.sf).trim():q,j=await get(s,urlFor(s,e,qq,p)),a=Array.isArray(j)?j:j.post||j.posts||[];
  if(!Array.isArray(a))throw E('bad','Unexpected response');if(s.engine=='auto'){s.engine=e;save()}
  return a.map(x=>norm(x,s,e)).filter(Boolean)}catch(er){last=er;if(!['bad','http'].includes(er.kind))throw er}}
 throw last}

/* ---- feed ---- */
let Q='',gen=0,loading=false,fav=false,seen=new Set();const P={},g=$('#g'),g2=$('#g2');
const card=(p,nw)=>`<div class="c${p.lv?' x':''}" data-k="${esc(p.k)}" role="button" tabindex="0">${p.lv&&S.blur?`<div class="hide">${IC.eye}<span>Sensitive<br>tap to view</span></div>`:`<img loading="lazy" referrerpolicy="no-referrer" alt="" src="${esc(p.pv)}">`}<span class="b">${esc(p.src)}</span>${nw?'<span class="n">NEW</span>':''}<i class="r r${p.lv}"></i>${S.favs[p.k]?`<span class="sv">${IC.heart}</span>`:''}</div>`;
function chips(){S.fab&&clampFab();$('#ch').innerHTML=S.sources.filter(s=>active(s)&&s.st).map(s=>{const k=s.st.k,ok=k=='ok';
 return`<span class="chip ${ok?'ok':k=='rate'?'rate':k=='captcha'?'captcha':'er'}" title="${esc(s.st.m||'')}">${esc(s.name)}: ${ok?s.st.n+' loaded':esc(s.st.m||k)}${k=='captcha'?`<button data-s="${s.id}">Solve</button>`:''}${k!='ok'?`<button data-r="${s.id}" style="background:var(--pn)">Retry</button>`:''}</span>`}).join('')}
async function load(mode,tr=0){
 if(fav||(loading&&mode!='new'))return;const act=S.sources.filter(active);S.sources.forEach(s=>{if(!active(s))delete s.st});
 if(mode=='new'){gen++;seen.clear();g.innerHTML='';act.forEach(s=>s.page=0)}
 const my=gen,q=/^\d+$/.test(Q)?'id:'+Q:Q;loading=true;$('#s img').hidden=false;
 const res=await Promise.all(act.map(async s=>{try{const pg=mode=='more'?(s.page||0)+1:0,l=await fetchSrc(s,q,pg);if(mode=='more')s.page=pg;s.st={k:'ok',n:l.length};return l}catch(e){s.st={k:e.kind||'net',m:e.message};return[]}}));
 loading=false;$('#s img').hidden=true;if(my!=gen)return;chips();
 const ls=res.map(l=>l.filter(p=>p.lv<=S.rating&&!seen.has(p.k))),out=[];
 for(let i=0;ls.some(l=>i<l.length);i++)ls.forEach(l=>l[i]&&out.push(l[i]));
 out.forEach(p=>{seen.add(p.k);P[p.k]=p});
 g.insertAdjacentHTML(mode=='refresh'?'afterbegin':'beforeend',out.map(p=>card(p,mode=='refresh')).join(''));
 if(!out.length&&mode=='more'&&res.some(l=>l.length)&&tr<3)return load('more',tr+1);
 if(!g.children.length)g.innerHTML='<p class="em">'+(act.length?'No results yet. Check the source chips above for captcha or rate-limit notices.':'Turn on a source in ⚙ Sources.')+'</p>';
 if(mode=='refresh'&&out.length)toast(out.length+' new post'+(out.length>1?'s':''))}
function search(){Q=$('#q').value.trim();show('feed');if(Q){S.hist=[Q,...S.hist.filter(x=>x!=Q)].slice(0,20);save()}load('new')}
new IntersectionObserver(e=>e[0].isIntersecting&&load('more'),{rootMargin:'900px'}).observe($('#s'));
let timer;function auto(){clearInterval(timer);if(S.auto)timer=setInterval(()=>!document.hidden&&!fav&&load('refresh'),S.auto*1000)}

/* ---- actions ---- */
function solve(s){const url=s.url.replace('api.','');
 if(window.cordova&&cordova.InAppBrowser){const b=cordova.InAppBrowser.open(url,'_blank','location=yes,clearcache=no');b.addEventListener('exit',()=>{s.cool=0;load('refresh')});toast('Solve the check, then close the window.',5000)}
 else{window.open(url,'_blank');toast('Solve it in the new tab, then tap Retry. Browsers keep that cookie private, so this works best in the Android app.',7000)}}
async function dl(p){
 const ext=(p.fu.split('?')[0].match(/\.(\w{3,4})$/)||[,'jpg'])[1],name=`${p.src}_${p.id}.${ext}`;toast('Downloading…');
 try{let r;try{r=await fetch(p.fu)}catch{r=await fetch('https://corsproxy.io/?'+encodeURIComponent(p.fu))}
  const bl=await r.blob(),FS=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Filesystem;
  if(NATIVE&&FS){const data=await new Promise(o=>{const f=new FileReader;f.onload=()=>o(f.result.split(',')[1]);f.readAsDataURL(bl)});
   try{await FS.writeFile({path:'Hoardling/'+name,data,directory:'DOCUMENTS',recursive:true});toast('Saved to Documents/Hoardling/'+name)}
   catch{await FS.writeFile({path:'Hoardling/'+name,data,directory:'EXTERNAL',recursive:true});toast('Saved to app storage: Hoardling/'+name)}}
  else{const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=name;a.click();toast('Saved '+name)}
  S.dls[p.k]={...p,t:Date.now()};save();badges();
 }catch{toast('Download blocked. Opening the file instead.');window.open(p.fu,'_blank')}}
let view='feed';
function show(v){view=v;fav=v!='feed';g.hidden=fav;g2.hidden=!fav;$('#s').style.display=fav?'none':'';if(fav)lib(v);scrollTo(0,0);fabVis()}
function lib(v){const l=Object.values(v=='fav'?S.favs:S.dls).sort((a,b)=>(b.t||0)-(a.t||0)),h=v=='dl',n=l.length;
 g2.innerHTML=`<div class="info"><span>${h?n+' saved file'+(n==1?'':'s')+' · Documents/Hoardling':n+' favorite'+(n==1?'':'s')}</span>${n?`<button data-clear="${v}">Clear list</button>`:''}</div>`+(n?l.map(p=>(P[p.k]=p,card(p))).join(''):`<p class="em"><img class="bun" alt=""><br>${h?'Your hoard is empty.<br>Tap Save on a post and it lands here.':'No favorites yet.<br>Tap ♥ on a post to keep it here.'}</p>`);badges()}
function badges(){}
g.onclick=g2.onclick=e=>{const b=e.target.closest('button[data-clear]');
 if(b){if(confirm('Clear this list? Files already saved stay on your phone.')){b.dataset.clear=='fav'?S.favs={}:S.dls={};save();lib(view)}return}
 const c=e.target.closest('.c');if(c)openSheet(P[c.dataset.k])};
g.onkeydown=g2.onkeydown=e=>{if(e.key=='Enter'&&e.target.classList.contains('c'))e.target.click()};
/* ---- detail sheet ---- */
let cur=null,MED=null;const sh=$('#sh'),sc=$('#sc');
function openSh(){sh.hidden=sc.hidden=false;sh.scrollTop=0;fabVis()}
function closeSh(){sh.hidden=sc.hidden=true;$('#shb').innerHTML='';fabVis()}
sc.onclick=$('#shx').onclick=closeSh;
function openSheet(p){cur=p;const ext=((p.fu.split('?')[0].match(/\.(\w{3,4})$/)||[])[1]||'').toLowerCase(),vid=/^(mp4|webm)$/.test(ext),tg=(p.tg||'').split(' ').filter(Boolean).slice(0,40),sv=!!S.favs[p.k];
 const med=()=>vid?`<video src="${esc(p.fu)}" controls playsinline loop muted></video>`:`<img referrerpolicy="no-referrer" alt="" src="${esc(p.sm||p.fu)}">`;MED=med;
 $('#shb').innerHTML=`<div class="pv${p.lv&&S.blur?' bl':''}">${p.lv&&S.blur?`<div class="rv">${IC.eye}<span>Sensitive. Tap to reveal</span></div>`:med()}</div>
 <h3>${esc(p.src)} <span>#${p.id}</span></h3>
 <div class="meta"><span>${['Safe','Questionable','Explicit'][p.lv]}</span>${ext?`<span>${ext.toUpperCase()}</span>`:''}${p.w?`<span>${p.w} × ${p.h}</span>`:''}</div>
 ${tg.length?`<div class="tg">${tg.map(x=>`<button data-t="${esc(x)}">${esc(x)}</button>`).join('')}</div>`:''}
 <div class="act"><button class="go" data-s="dl">${IC.dl} ${S.dls[p.k]?'Download again':'Download'}</button><button data-s="fav" class="${sv?'on':''}">${IC.heart} ${sv?'Saved':'Save'}</button></div>
 <div class="lk"><a href="${esc(p.link)}" target="_blank" rel="noopener">View post</a><a href="${esc(p.fu)}" target="_blank" rel="noopener">Full file</a>${S.dls[p.k]?'<button data-s="fg">Forget download</button>':''}</div>`;openSh()}
function openHist(){cur=null;$('#shb').innerHTML='<h3 style="margin-top:4px">History</h3>'+(S.hist.length?`<div class="hl">${S.hist.map((h,i)=>`<button data-h="${i}">${IC.clock}${esc(h)}</button>`).join('')}</div><div class="lk" style="margin-top:10px"><button data-hc="1">Clear history</button></div>`:'<p class="em"><img class="bun" alt=""><br>No searches yet.</p>');openSh()}
$('#shb').onclick=e=>{const pv=e.target.closest('.pv.bl');if(pv){pv.classList.remove('bl');pv.innerHTML=MED();return}const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.t){closeSh();$('#q').value=d.t;search()}
 else if(d.h!=null){const h=S.hist[+d.h];closeSh();$('#q').value=h;search()}
 else if(d.hc){S.hist=[];save();openHist()}
 else if(d.s=='dl')dl(cur)
 else if(d.s=='fav'){if(S.favs[cur.k]){delete S.favs[cur.k];toast('Removed from Saved')}else{S.favs[cur.k]={...cur,t:Date.now()};toast('Added to Saved')}save();openSheet(cur);if(view=='fav')lib('fav');else{const c=g.querySelector(`[data-k="${CSS.escape(cur.k)}"]`);c&&(c.outerHTML=card(cur))}}
 else if(d.s=='fg'){delete S.dls[cur.k];save();openSheet(cur);if(view=='dl')lib('dl')}};
/* ---- floating menu button ---- */
const fab=$('#fab'),mn=$('#mn'),FZ=54;let dr=null,dragged=false,docked=true,tm;
const hb=()=>$('header').getBoundingClientRect().bottom+8;
const dockX=()=>S.fab.s=='l'?-FZ+22:innerWidth-22;
function place(){fab.style.left=(docked?dockX():S.fab.x)+'px';fab.style.top=S.fab.y+'px';fab.classList.toggle('dk',docked)}
function armDock(){clearTimeout(tm);tm=setTimeout(()=>{if(dr||!mn.hidden)return armDock();S.fab.s=S.fab.x+FZ/2<innerWidth/2?'l':'r';docked=true;place();save()},2500)}
function clampFab(){const top=hb();S.fab.x=Math.min(Math.max(6,S.fab.x),innerWidth-FZ-6);S.fab.y=Math.min(Math.max(top,S.fab.y),Math.max(top,innerHeight-FZ-8));place()}
function closeMenu(){mn.hidden=true;armDock()}
function fabVis(){}
function openMenu(){clampFab();const it=[['feed','Feed',IC.feed,''],['fav','Saved',IC.heart,Object.keys(S.favs).length||''],['dl','Hoard',IC.dl,Object.keys(S.dls).length||''],['hist','History',IC.clock,S.hist.length||''],['fetch','Fetch now',IC.sync,'']];
 mn.innerHTML=it.map(([k,n,ic,c])=>`<button data-m="${k}" class="${k==view&&sh.hidden?'cur':''}">${ic}${n}${c?`<span>${c}</span>`:''}</button>`).join('');mn.hidden=false;
 const mh=mn.offsetHeight,mw=mn.offsetWidth,top=hb()-2;let up=S.fab.y+FZ/2>innerHeight/2;if(up&&S.fab.y-mh-8<top)up=false;if(!up&&S.fab.y+FZ+mh+8>innerHeight)up=true;
 mn.style.top=Math.max(top,up?S.fab.y-mh-8:S.fab.y+FZ+8)+'px';const right=S.fab.x+FZ/2>innerWidth/2;mn.style.left=Math.min(Math.max(6,right?S.fab.x+FZ-mw:S.fab.x),innerWidth-mw-6)+'px'}
fab.onpointerdown=e=>{if(docked){S.fab.x=S.fab.s=='l'?6:innerWidth-FZ-6;docked=false}fab.classList.add('drag');place();clearTimeout(tm);dr={sx:e.clientX,sy:e.clientY,x:S.fab.x,y:S.fab.y,m:0};dragged=false;fab.setPointerCapture(e.pointerId)};
fab.onpointermove=e=>{if(!dr)return;const dx=e.clientX-dr.sx,dy=e.clientY-dr.sy;if(Math.abs(dx)+Math.abs(dy)>8)dr.m=1;if(dr.m){S.fab.x=dr.x+dx;S.fab.y=dr.y+dy;clampFab();closeMenu()}};
fab.onpointerup=fab.onpointercancel=()=>{fab.classList.remove('drag');armDock();if(dr&&dr.m){dragged=true;save()}dr=null};
fab.onclick=()=>{if(dragged){dragged=false;return}mn.hidden?openMenu():closeMenu()};
document.addEventListener('pointerdown',e=>{if(!mn.hidden&&!e.target.closest('#mn,#fab'))closeMenu()});
document.addEventListener('keydown',e=>{if(e.key=='Escape'){closeMenu();closeSh()}});
mn.onclick=e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.m;closeMenu();closeSh();
 if(a=='hist')openHist();else if(a=='fetch'){show('feed');S.sources.forEach(s=>s.cool=0);load('refresh');toast('Fetching every source now. Waits between requests still apply.')}
 else if(a=='feed'&&view=='feed')scrollTo({top:0,behavior:'smooth'});else show(a)};
S.fab=S.fab||{x:innerWidth-72,y:innerHeight-150};S.fab.s=S.fab.s||'r';clampFab();fabVis();addEventListener('scroll',fabVis,{passive:true});addEventListener('resize',()=>{clampFab();fabVis()});
$('#ch').onclick=e=>{const b=e.target.closest('button'),s=b&&S.sources.find(x=>x.id==(b.dataset.s||b.dataset.r));if(!s)return;
 if(b.dataset.s)solve(s);else{s.cool=0;load('refresh')}};
$('#go').onclick=search;$('#q').onkeydown=e=>e.key=='Enter'&&search();
/* ---- settings ---- */
const CATS=[['safe','Safe only'],['mix','Mixed: safe and mature'],['adult','Mature (18+): used only when Ratings is Everything']];
function setUI(){$('#sl').innerHTML=CATS.map(([c,n])=>{const l=S.sources.map((s,i)=>[s,i]).filter(([s])=>(s.cat||'mix')==c);return l.length?`<p class="sub">${n}</p>`+l.map(([s,i])=>`<div class="sr"><input type="checkbox" class="sw" data-i="${i}" data-f="on" ${s.on?'checked':''} aria-label="${esc(s.name)}"><div class="nm"><b>${esc(s.name)}</b><small>${esc(s.url)}</small></div><button data-key="${i}">${s.key?'Key ✓':'Key'}</button></div>
 <div class="kr" id="kr${i}"><input placeholder="User ID" value="${esc(s.user)}" data-i="${i}" data-f="user"><input placeholder="API key" value="${esc(s.key)}" data-i="${i}" data-f="key">${s.b?'':`<button data-x="${i}">Remove</button>`}</div>`).join(''):''}).join('');
 $('#pr').value=S.rating;$('#pb').checked=S.blur;$('#pa').value=S.auto}
$('#st').onclick=()=>{setUI();$('#d').showModal()};
$('#sl').onchange=e=>{const t=e.target,s=S.sources[t.dataset.i];if(s){s[t.dataset.f]=t.type=='checkbox'?t.checked:t.value.trim();save()}};
$('#sl').onclick=e=>{const d=e.target.dataset,i=d.x;if(d.key!=null)$('#kr'+d.key).classList.toggle('o');if(i!=null){S.sources.splice(i,1);save();setUI()}};
$('#aa').onclick=()=>{let n=$('#an').value.trim(),u=$('#au').value.trim();if(!n||!/^https?:\/\//.test(u))return toast('Enter a name and a link starting with https://');
 S.sources.push({id:'c'+Date.now(),name:n,url:u,engine:$('#ae').value,cat:$('#ac').value,on:true,key:'',user:''});save();$('#an').value=$('#au').value='';setUI()};
$('#pr').onchange=e=>{const v=+e.target.value;if(v&&!confirm('This can show adult content. Are you 18 or older?')){e.target.value=S.rating;return}S.rating=v;save()};
$('#pb').onchange=e=>{S.blur=e.target.checked;document.body.classList.toggle('blur',S.blur);save()};
$('#pa').onchange=e=>{S.auto=+e.target.value;save();auto()};
$('#dc').onclick=()=>{$('#d').close();search()};
document.body.classList.toggle('blur',S.blur);auto();
Promise.all([load('new'),sleep(1400)]).then(()=>{const sp=$('#sp');sp.style.opacity=0;setTimeout(()=>sp.remove(),400)});
</script></body></html>

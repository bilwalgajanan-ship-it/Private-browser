<style>
:root{--bg:#0e1719;--pn:#172a30;--ln:#27424a;--tx:#e8f0ee;--mu:#8fa8ab;--ac:#c4569f;--go:#ecd9a0;--ok:#5fd0a0;--wr:#f0b45a;--er:#ef6a6a}
*{box-sizing:border-box}html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}
button{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--ac)}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--go);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--ln);padding:calc(8px + env(safe-area-inset-top)) 10px 8px}
.bar{display:flex;gap:8px;align-items:center}
.bar img.l{width:38px;height:38px;border-radius:10px}
#q{flex:1;min-width:0;background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:10px 12px}
.go{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.row{display:flex;gap:6px;overflow-x:auto;margin-top:8px;scrollbar-width:none}.row>*{flex:none}
.chip{font-size:12.5px;padding:4px 9px;border-radius:99px;border:1px solid var(--ln);background:var(--pn);color:var(--mu)}
.chip.ok{color:var(--ok)}.chip.rate{color:var(--wr)}.chip.captcha{color:var(--wr)}.chip.er{color:var(--er)}
.chip button{padding:0 6px;margin-left:4px;border-radius:99px;font-size:12px;background:var(--ac);border-color:var(--ac);color:#fff}
#g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:10px}
@media(min-width:700px){#g{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}
.c{position:relative;background:var(--pn);border-radius:12px;overflow:hidden;aspect-ratio:3/4}
.c a,.c img{display:block;width:100%;height:100%}.c img{object-fit:cover;background:var(--pn)}
.blur .c.x img{filter:blur(22px) brightness(.8)}
.b{position:absolute;left:6px;top:6px;background:#000b;border-radius:6px;padding:1px 7px;font-size:11.5px}
.n{position:absolute;right:6px;top:6px;background:var(--go);color:#222;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700}
.r{position:absolute;left:8px;bottom:50px;width:9px;height:9px;border-radius:50%;background:var(--ok)}.r1{background:var(--wr)}.r2{background:var(--er)}
.a{position:absolute;inset:auto 0 0;display:flex;gap:6px;padding:6px;background:linear-gradient(#0000,#000c)}
.a button{flex:1;padding:5px;background:#0009}.a .f{color:var(--ac)}
#s{height:60px;display:flex;justify-content:center;align-items:center;color:var(--mu)}
.bun{image-rendering:pixelated;width:60px}.sm{width:36px}
#sp{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;transition:opacity .4s}
#sp b{font-size:22px;color:var(--go);letter-spacing:.5px}#sp .bun{width:120px}
dialog{background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:16px;width:min(560px,94vw);max-height:88vh}
dialog::backdrop{background:#000a}
.s1{display:flex;gap:6px;align-items:center;margin:8px 0;flex-wrap:wrap}
.s1 input[type=text],.s1 input:not([type]),.s1 select{background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:6px 8px;min-width:0}
.s1 .w{flex:1}
#t{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000e;border:1px solid var(--ln);padding:8px 14px;border-radius:12px;z-index:30;display:none;max-width:90vw}
.em{text-align:center;color:var(--mu);padding:40px 20px;grid-column:1/-1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body class="blur">

function toast(m,ms=3200){const t=$('#t');t.textContent=m;t.style.display='block';clearTimeout(toast.i);toast.i=setTimeout(()=>t.style.display='none',ms)}

/* ---- network: native HTTP on Android, proxies in browsers, per-source rate limiting ---- */
const MIN_GAP=1200;
async function get(s,url){
 if(s.cool>Date.now())throw E('rate','Cooling down '+Math.ceil((s.cool-Date.now())/1000)+'s');
 s.q=(s.q||Promise.resolve()).then(()=>sleep(Math.max(0,(s.last||0)+MIN_GAP-Date.now()))).then(()=>s.last=Date.now());await s.q;
 const enc=encodeURIComponent(url),tries=NATIVE?[url]:[url,'https://corsproxy.io/?'+enc,'https://api.allorigins.win/raw?url='+enc];let last;
 for(const u of tries){try{
  const r=await fetch(u,NATIVE?{headers:{'User-Agent':navigator.userAgent}}:{});
  if(r.status==429){const w=+r.headers.get('retry-after')||20;s.cool=Date.now()+w*1000;throw E('rate','Rate limited, retrying in '+w+'s')}
  const t=await r.text();
  if(/just a moment|cf-chl|challenge-platform|attention required|captcha/i.test(t.slice(0,4000))||((r.status==403||r.status==503)&&t[0]=='<'))throw E('captcha','Needs a captcha check');
  if(!r.ok)throw E('http','HTTP '+r.status);
  let j;try{j=JSON.parse(t)}catch{throw E('bad','Not JSON (may need an API key)')}
  if(j&&j.success===false)throw E('auth',j.message||'Rejected, add an API key');
  return j}catch(e){if(e.kind=='rate')throw e;if(!(last&&last.kind=='captcha'))last=e.kind?e:E('net','Blocked or offline')}}
 throw last}
function urlFor(s,e,q,p){const b=s.url.replace(/\/$/,''),t=encodeURIComponent(q);
 if(e=='dan')return`${b}/posts.json?tags=${t}&limit=40&page=${p+1}`+(s.key?`&login=${encodeURIComponent(s.user)}&api_key=${encodeURIComponent(s.key)}`:'');
 if(e=='moe')return`${b}/post.json?tags=${t}&limit=40&page=${p+1}`;
 return`${b}/index.php?page=dapi&s=post&q=index&json=1&tags=${t}&limit=40&pid=${p}`+(s.key?`&api_key=${encodeURIComponent(s.key)}&user_id=${encodeURIComponent(s.user)}`:'')}
function norm(x,s,e){const b=s.url.replace(/\/$/,''),fix=u=>!u?'':u.startsWith('//')?'https:'+u:u[0]=='/'?b+u:u;
 let pv=fix(x.preview_url||x.preview_file_url||x.sample_url||x.large_file_url),fu=fix(x.file_url||x.large_file_url||x.sample_url);
 if(x.directory&&x.image){pv=pv||`${b}/thumbnails/${x.directory}/thumbnail_${x.hash}.jpg`;fu=fu||`${b}/images/${x.directory}/${x.image}`}
 if(!pv&&!fu)return null;const r=String(x.rating||'?')[0];
 return{k:s.id+':'+x.id,id:+x.id,src:s.name,pv:pv||fu,fu:fu||pv,lv:r=='e'?2:r=='q'?1:0,
  link:e=='dan'?`${b}/posts/${x.id}`:e=='moe'?`${b}/post/show/${x.id}`:`${b.replace('api.','')}/index.php?page=post&s=view&id=${x.id}`}}
async function fetchSrc(s,q,p){
 const es=s.engine=='auto'?['dan','moe','dapi']:[s.engine];let last;
 for(const e of es){try{const j=await get(s,urlFor(s,e,q,p)),a=Array.isArray(j)?j:j.post||j.posts||[];
  if(!Array.isArray(a))throw E('bad','Unexpected response');if(s.engine=='auto'){s.engine=e;save()}
  return a.map(x=>norm(x,s,e)).filter(Boolean)}catch(er){last=er;if(!['bad','http'].includes(er.kind))throw er}}
 throw last}

/* ---- feed ---- */
let Q='',gen=0,loading=false,fav=false,seen=new Set();const P={},g=$('#g');
const card=(p,nw)=>`<div class="c${p.lv?' x':''}" data-k="${esc(p.k)}"><a href="${esc(p.fu)}" target="_blank" rel="noopener"><img loading="lazy" referrerpolicy="no-referrer" alt="" src="${esc(p.pv)}"></a><span class="b">${esc(p.src)}</span>${nw?'<span class="n">NEW</span>':''}<i class="r r${p.lv}"></i><div class="a"><button data-a="f" class="${S.favs[p.k]?'f':''}" aria-label="Favorite">♥</button><button data-a="d" aria-label="Download">⬇ Save</button></div></div>`;
function chips(){$('#ch').innerHTML=S.sources.filter(s=>s.on&&s.st).map(s=>{const k=s.st.k,ok=k=='ok';
 return`<span class="chip ${ok?'ok':k=='rate'?'rate':k=='captcha'?'captcha':'er'}" title="${esc(s.st.m||'')}">${esc(s.name)}: ${ok?s.st.n+' loaded':esc(s.st.m||k)}${k=='captcha'?`<button data-s="${s.id}">Solve</button>`:''}${k!='ok'?`<button data-r="${s.id}" style="background:var(--pn)">Retry</button>`:''}</span>`}).join('')}
async function load(mode,tr=0){
 if(fav||(loading&&mode!='new'))return;const act=S.sources.filter(s=>s.on);
 if(mode=='new'){gen++;seen.clear();g.innerHTML='';act.forEach(s=>s.page=0)}
 const my=gen,q=/^\d+$/.test(Q)?'id:'+Q:Q;loading=true;$('#s img').hidden=false;
 const res=await Promise.all(act.map(async s=>{try{const pg=mode=='more'?(s.page||0)+1:0,l=await fetchSrc(s,q,pg);if(mode=='more')s.page=pg;s.st={k:'ok',n:l.length};return l}catch(e){s.st={k:e.kind||'net',m:e.message};return[]}}));
 loading=false;$('#s img').hidden=true;if(my!=gen)return;chips();
 const ls=res.map(l=>l.filter(p=>p.lv<=S.rating&&!seen.has(p.k))),out=[];
 for(let i=0;ls.some(l=>i<l.length);i++)ls.forEach(l=>l[i]&&out.push(l[i]));
 out.forEach(p=>{seen.add(p.k);P[p.k]=p});
 g.insertAdjacentHTML(mode=='refresh'?'afterbegin':'beforeend',out.map(p=>card(p,mode=='refresh')).join(''));
 if(!out.length&&mode=='more'&&res.some(l=>l.length)&&tr<3)return load('more',tr+1);
 if(!g.children.length)g.innerHTML='<p class="em">'+(act.length?'No results yet. Check the source chips above for captcha or rate-limit notices.':'Turn on a source in ⚙ Sources.')+'</p>';
 if(mode=='refresh'&&out.length)toast(out.length+' new post'+(out.length>1?'s':''))}
function search(){Q=$('#q').value.trim();fav=false;if(Q){S.hist=[Q,...S.hist.filter(x=>x!=Q)].slice(0,8);save();hist()}load('new')}
function hist(){$('#h').innerHTML=S.hist.map(h=>`<button class="chip" data-h="${esc(h)}">${esc(h)}</button>`).join('')}
new IntersectionObserver(e=>e[0].isIntersecting&&load('more'),{rootMargin:'900px'}).observe($('#s'));
let timer;function auto(){clearInterval(timer);if(S.auto)timer=setInterval(()=>!document.hidden&&!fav&&load('refresh'),S.auto*1000)}

/* ---- actions ---- */
function solve(s){const url=s.url.replace('api.','');
 if(window.cordova&&cordova.InAppBrowser){const b=cordova.InAppBrowser.open(url,'_blank','location=yes,clearcache=no');b.addEventListener('exit',()=>{s.cool=0;load('refresh')});toast('Solve the check, then close the window.',5000)}
 else{window.open(url,'_blank');toast('Solve it in the new tab, then tap Retry. Browsers keep that cookie private, so this works best in the Android app.',7000)}}
async function dl(p){
 const ext=(p.fu.split('?')[0].match(/\.(\w{3,4})$/)||[,'jpg'])[1],name=`${p.src}_${p.id}.${ext}`;toast('Downloading…');
 try{let r;try{r=await fetch(p.fu)}catch{r=await fetch('https://corsproxy.io/?'+encodeURIComponent(p.fu))}
  const bl=await r.blob(),FS=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Filesystem;
  if(NATIVE&&FS){const data=await new Promise(o=>{const f=new FileReader;f.onload=()=>o(f.result.split(',')[1]);f.readAsDataURL(bl)});
   try{await FS.writeFile({path:'Wyrmfeed/'+name,data,directory:'DOCUMENTS',recursive:true});toast('Saved to Documents/Wyrmfeed/'+name)}
   catch{await FS.writeFile({path:'Wyrmfeed/'+name,data,directory:'EXTERNAL',recursive:true});toast('Saved to app storage: Wyrmfeed/'+name)}}
  else{const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=name;a.click();toast('Saved '+name)}
 }catch{toast('Download blocked. Opening the file instead.');window.open(p.fu,'_blank')}}
function favs(){fav=true;gen++;g.innerHTML=Object.values(S.favs).map(p=>(P[p.k]=p,card(p))).join('')||'<p class="em">No favorites yet. Tap ♥ on a post.</p>'}
g.onclick=e=>{const b=e.target.closest('button');if(!b)return;const p=P[b.closest('.c').dataset.k];
 if(b.dataset.a=='d')dl(p);else{S.favs[p.k]?delete S.favs[p.k]:S.favs[p.k]=p;b.classList.toggle('f');save()}};
$('#ch').onclick=e=>{const b=e.target.closest('button'),s=b&&S.sources.find(x=>x.id==(b.dataset.s||b.dataset.r));if(!s)return;
 if(b.dataset.s)solve(s);else{s.cool=0;load('refresh')}};
$('#h').onclick=e=>{const h=e.target.dataset.h;if(h){$('#q').value=h;search()}};
$('#go').onclick=search;$('#q').onkeydown=e=>e.key=='Enter'&&search();
$('#fo').onclick=()=>{S.sources.forEach(s=>s.cool=0);fav=false;load('refresh');toast('Fetching all sources now. Waits between requests still apply.')};
$('#fv').onclick=favs;

/* ---- settings ---- */
function setUI(){$('#sl').innerHTML=S.sources.map((s,i)=>`<div class="s1"><label class="w"><input type="checkbox" data-i="${i}" data-f="on" ${s.on?'checked':''}> <b>${esc(s.name)}</b> <small style="color:var(--mu)">${esc(s.url)}</small></label>
 <input style="width:30%" placeholder="user id" value="${esc(s.user)}" data-i="${i}" data-f="user"><input style="width:30%" placeholder="API key" value="${esc(s.key)}" data-i="${i}" data-f="key">${s.b?'':`<button data-x="${i}">✕</button>`}</div>`).join('');
 $('#pr').value=S.rating;$('#pb').checked=S.blur;$('#pa').value=S.auto}
$('#st').onclick=()=>{setUI();$('#d').showModal()};
$('#sl').onchange=e=>{const t=e.target,s=S.sources[t.dataset.i];if(s){s[t.dataset.f]=t.type=='checkbox'?t.checked:t.value.trim();save()}};
$('#sl').onclick=e=>{const i=e.target.dataset.x;if(i!=null){S.sources.splice(i,1);save();setUI()}};
$('#aa').onclick=()=>{let n=$('#an').value.trim(),u=$('#au').value.trim();if(!n||!/^https?:\/\//.test(u))return toast('Enter a name and a link starting with https://');
 S.sources.push({id:'c'+Date.now(),name:n,url:u,engine:$('#ae').value,on:true,key:'',user:''});save();$('#an').value=$('#au').value='';setUI()};
$('#pr').onchange=e=>{const v=+e.target.value;if(v&&!confirm('This can show adult content. Are you 18 or older?')){e.target.value=S.rating;return}S.rating=v;save()};
$('#pb').onchange=e=>{S.blur=e.target.checked;document.body.classList.toggle('blur',S.blur);save()};
$('#pa').onchange=e=>{S.auto=+e.target.value;save();auto()};
$('#dc').onclick=()=>{$('#d').close();search()};
document.body.classList.toggle('blur',S.blur);hist();auto();
Promise.all([load('new'),sleep(1400)]).then(()=>{const sp=$('#sp');sp.style.opacity=0;setTimeout(()=>sp.remove(),400)});
</script></body></html>

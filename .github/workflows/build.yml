name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q PrivateBrowser.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: PrivateBrowser
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp PrivateBrowser/app/build/outputs/apk/debug/app-debug.apk PrivateBrowser-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PrivateBrowser-debug-apk
          path: PrivateBrowser-debug.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Private Browser build ${{ github.run_number }}
          prerelease: true
          files: PrivateBrowser-debug.apk

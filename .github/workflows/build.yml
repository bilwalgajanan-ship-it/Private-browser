name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Project setup
        run: |
          mkdir www assets
          cp index.html www/
          pip install pillow
          python3 - <<'EOF'
          import re,base64,io
          from PIL import Image
          h=open('index.html').read()
          b=re.search(r'rel="icon" href="data:image/png;base64,([^"]+)"',h).group(1)
          Image.open(io.BytesIO(base64.b64decode(b))).convert('RGBA').resize((1024,1024),Image.LANCZOS).save('assets/icon-only.png')
          EOF
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capacitor/assets cordova-plugin-inappbrowser
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.wyrmfeed.app",
            "appName": "Wyrmfeed",
            "webDir": "www",
            "backgroundColor": "#0e1719",
            "plugins": {
              "CapacitorHttp": { "enabled": true },
              "CapacitorCookies": { "enabled": true }
            }
          }
          EOF
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#0e1719' --iconBackgroundColorDark '#0e1719'
          npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Wyrmfeed-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

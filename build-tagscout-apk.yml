      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Capacitor project
        run: |
          mkdir app && cd app
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6 @capacitor/browser@6
          mkdir www
          cp ../index.html www/index.html
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.tagscout.app",
            "appName": "Tagscout",
            "webDir": "www",
            "server": { "androidScheme": "https" },
            "plugins": { "CapacitorHttp": { "enabled": true } }
          }
          JSON
          npx cap add android
          npx cap sync android

      - name: Generate app icons from icon.png
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os, shutil
          src = Image.open("icon.png").convert("RGBA")
          res = "app/android/app/src/main/res"
          shutil.rmtree(f"{res}/mipmap-anydpi-v26", ignore_errors=True)
          for d, s in {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}.items():
              p = f"{res}/mipmap-{d}"
              os.makedirs(p, exist_ok=True)
              im = src.resize((s, s), Image.LANCZOS)
              im.save(f"{p}/ic_launcher.png")
              im.save(f"{p}/ic_launcher_foreground.png")
              mask = Image.new("L", (s*4, s*4), 0)
              ImageDraw.Draw(mask).ellipse((0, 0, s*4-1, s*4-1), fill=255)
              rnd = im.copy()
              rnd.putalpha(mask.resize((s, s), Image.LANCZOS))
              rnd.save(f"{p}/ic_launcher_round.png")
          PY

      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Tagscout-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
